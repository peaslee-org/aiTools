[project]
name = "photogrammetry-worker"
version = "0.1.0"
description = "GPU worker: COLMAP → OpenMVS → GLB for aitools.peaslee.org photogrammetry jobs"
requires-python = ">=3.12"
dependencies = [
    "gpu-worker",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "trimesh>=4.4",
    "pillow>=12.0",   # export.py relies on image-level encoderinfo in Image.save
    "numpy>=1.26",
    "opencv-python-headless>=4.10",   # masks: connected components, hole fill, dilation, overlay drawing
    "onnxruntime>=1.20",              # masks: u2netp inference on CPU
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.uv.sources]
gpu-worker = { path = "../gpu-worker", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
